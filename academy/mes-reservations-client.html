<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mes réservations — One Sport Academy</title>
<meta name="description" content="Consultez vos réservations de coaching privé One Sport Academy." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --black:#0A0A0A; --surface:#111111; --surface2:#181818; --border:#2a2a2a; --text:#EEEEEE; --gold:#C9A84C; --red:#E05252; --green:#4ADE80; --amber:#D4A857; }
  body { background:var(--black); color:var(--text); font-family:'Barlow',sans-serif; min-height:100vh; }
  a { color:inherit; }
  h1,h2,h3 { font-family:'Barlow Condensed',sans-serif; font-weight:700; }

  nav { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-bottom:1px solid var(--border); }
  .nav-logo img { height:36px; filter:invert(1); }
  .nav-back { font-family:'Barlow Condensed',sans-serif; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#999; text-decoration:none; }
  .nav-back:hover { color:var(--gold); }

  .container { max-width:760px; margin:0 auto; padding:40px 20px 90px; }
  .loading-state { text-align:center; padding:80px 20px; color:#777; }
  .error-banner { background:rgba(224,82,82,0.1); border:1px solid rgba(224,82,82,0.4); color:#F5A3A3; border-radius:5px; padding:14px 18px; font-size:0.88rem; margin-bottom:20px; }

  .auth-wrapper { max-width:400px; margin:60px auto; }
  .auth-wrapper h1 { font-size:1.4rem; text-transform:uppercase; margin-bottom:6px; }
  .auth-wrapper p.sub { color:#999; font-size:0.88rem; margin-bottom:26px; }
  .field-group { margin-bottom:14px; }
  .field-group label { display:block; font-size:0.78rem; color:#999; margin-bottom:5px; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:0.04em; }
  .field-group input { width:100%; padding:11px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:'Barlow',sans-serif; font-size:0.9rem; }
  .btn { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:0.84rem; letter-spacing:0.05em; text-transform:uppercase; padding:12px 22px; border-radius:3px; cursor:pointer; border:none; text-decoration:none; display:inline-block; width:100%; text-align:center; }
  .btn-primary { background:var(--gold); color:#0A0A0A; }
  .btn-primary:hover { background:#DDBC5C; }
  .link-btn { background:none; border:none; color:#999; font-size:0.82rem; cursor:pointer; text-decoration:underline; padding:0; font-family:'Barlow',sans-serif; }
  .msg { margin-top:14px; font-size:0.85rem; }
  .msg.error { color:#F5A3A3; }
  .msg.ok { color:var(--green); }

  .top-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:10px; }
  .top-header h1 { font-size:1.3rem; text-transform:uppercase; }
  .top-header .user-chip { font-size:0.82rem; color:#999; }
  .top-header .logout { font-size:0.78rem; color:#999; background:none; border:1px solid var(--border); border-radius:4px; padding:6px 12px; cursor:pointer; font-family:'Barlow',sans-serif; }
  .top-header .logout:hover { border-color:var(--gold); color:var(--gold); }
  .notif-wrap { position:relative; }
  .notif-bell { background:none; border:none; color:var(--text); font-size:1.1rem; cursor:pointer; position:relative; padding:4px; }
  .notif-badge { position:absolute; top:-2px; right:-2px; background:var(--gold); color:#0A0A0A; font-size:0.6rem; font-weight:800; border-radius:9px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px; font-family:'Barlow Condensed',sans-serif; }
  .notif-dropdown { display:none; position:absolute; top:34px; right:0; width:300px; max-height:380px; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:100; }
  .notif-dropdown.open { display:block; }
  .notif-item { padding:12px 16px; border-bottom:1px solid var(--border); font-size:0.82rem; color:var(--text); }
  .notif-item:last-child { border-bottom:none; }
  .notif-item.unread { background:rgba(201,168,76,0.08); }
  .notif-time { font-size:0.7rem; color:#777; margin-top:3px; }
  .notif-empty { padding:24px 16px; text-align:center; color:#777; font-size:0.84rem; }

  .section-title { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.06em; color:#777; margin:26px 0 12px; }

  .empty-state { text-align:center; padding:36px 20px; color:#777; font-size:0.9rem; }

  .booking-row { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:16px; flex-wrap:wrap; }
  .booking-left { display:flex; align-items:center; gap:14px; }
  .booking-date-box { width:54px; height:54px; border-radius:6px; background:var(--surface2); flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid var(--border); }
  .booking-date-box .day { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:1.15rem; color:var(--text); line-height:1; }
  .booking-date-box .month { font-size:0.62rem; color:#999; text-transform:uppercase; }
  .booking-title { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:0.95rem; }
  .booking-meta { font-size:0.8rem; color:#999; margin-top:3px; }
  .booking-right { display:flex; align-items:center; gap:16px; }
  .booking-amount { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:1rem; text-align:right; }
  .booking-amount .sub { font-size:0.7rem; color:#777; font-weight:400; display:block; text-transform:none; letter-spacing:0; }
  .status-pill { font-size:0.72rem; font-weight:600; padding:4px 11px; border-radius:11px; white-space:nowrap; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:0.03em; }
  .status-confirmed { background:rgba(74,222,128,0.12); color:var(--green); }
  .status-completed { background:var(--surface2); color:#999; }
  .status-cancelled { background:rgba(224,82,82,0.12); color:var(--red); }
  .status-noshow { background:rgba(212,168,87,0.12); color:var(--amber); }
  .btn-cancel { font-size:0.74rem; font-family:'Barlow Condensed',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:#999; background:none; border:1px solid var(--border); border-radius:4px; padding:6px 12px; cursor:pointer; margin-top:6px; }
  .btn-cancel:hover { border-color:var(--red); color:var(--red); }
  .btn-cancel:disabled { opacity:0.5; cursor:not-allowed; }
  .cancel-msg { font-size:0.76rem; margin-top:6px; }
  .cancel-msg.ok { color:var(--green); }
  .cancel-msg.error { color:#F5A3A3; }

  .btn-review { font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:0.74rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--gold); background:none; border:1px solid var(--gold); border-radius:4px; padding:6px 12px; cursor:pointer; margin-top:8px; }
  .btn-review:hover { background:rgba(201,168,76,0.1); }
  .review-form { margin-top:10px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:14px; max-width:340px; }
  .star-picker { font-size:1.4rem; letter-spacing:4px; margin-bottom:10px; }
  .star-choice { color:#444; cursor:pointer; transition:color 0.15s; }
  .star-choice.selected { color:var(--gold); }
  .review-form textarea { width:100%; min-height:60px; background:var(--surface); border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:'Barlow',sans-serif; font-size:0.85rem; padding:8px; resize:vertical; margin-bottom:10px; }
  .btn-primary-sm { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em; background:var(--gold); color:#0A0A0A; border:none; border-radius:4px; padding:8px 16px; cursor:pointer; }
  .btn-primary-sm:hover { background:#DDBC5C; }
  .btn-primary-sm:disabled { background:#444; color:#888; cursor:not-allowed; }
  .review-display { margin-top:8px; }
  .review-display .stars-shown { color:var(--gold); font-size:0.95rem; letter-spacing:2px; }
  .review-comment { font-size:0.82rem; color:#999; margin-top:4px; font-style:italic; }
</style>
</head>
<body>

<nav>
  <a href="/academy/" class="nav-logo"><img src="/logo-one-sport-officiel.png" alt="One Sport" /></a>
  <a href="/academy/" class="nav-back">← Retour</a>
</nav>

<div class="container">
  <div id="loadingState" class="loading-state">Chargement…</div>
  <div id="appRoot" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/ffp-supabase.js"></script>
<script>
(function () {
  var appRoot = document.getElementById('appRoot');
  var loadingEl = document.getElementById('loadingState');

  var STATUS_LABELS = {
    confirmed: ['Confirmée', 'status-confirmed'],
    cancelled_by_parent: ['Annulée', 'status-cancelled'],
    cancelled_by_coach: ['Annulée par le coach', 'status-cancelled'],
    completed: ['Terminée', 'status-completed'],
    no_show: ['Absence', 'status-noshow']
  };
  var MONTHS = ['JANV', 'FÉVR', 'MARS', 'AVR', 'MAI', 'JUIN', 'JUIL', 'AOÛT', 'SEPT', 'OCT', 'NOV', 'DÉC'];

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  async function init() {
    try { if (typeof initSupabase === 'function' && !window.FFP_DB) initSupabase(); } catch (e) {}
    if (!window.FFP_DB) { renderError('Connexion au service impossible. Réessayez plus tard.'); return; }
    var { data } = await FFP_DB.auth.getSession();
    loadingEl.style.display = 'none';
    appRoot.style.display = 'block';
    if (data && data.session) renderBookings(data.session);
    else renderLogin();
  }

  function renderError(msg) {
    loadingEl.style.display = 'none';
    appRoot.style.display = 'block';
    appRoot.innerHTML = '<div class="error-banner">' + escapeHtml(msg) + '</div>';
  }

  function renderLogin() {
    appRoot.innerHTML =
      '<div class="auth-wrapper">' +
      '<h1>Mes réservations</h1>' +
      '<p class="sub">Connectez-vous avec le compte créé lors de votre réservation.</p>' +
      '<div class="field-group"><label>E-mail</label><input type="email" id="liEmail" autocomplete="email"></div>' +
      '<div class="field-group"><label>Mot de passe</label><input type="password" id="liPassword" autocomplete="current-password"></div>' +
      '<button class="btn btn-primary" onclick="ClientBookings.doLogin()">Me connecter</button>' +
      '<div style="text-align:center; margin-top:16px;"><button class="link-btn" onclick="ClientBookings.doForgotPassword()">Mot de passe oublié ?</button></div>' +
      '<div id="loginMsg" class="msg"></div>' +
      '</div>';
  }

  async function doLogin() {
    var email = (document.getElementById('liEmail').value || '').trim();
    var password = document.getElementById('liPassword').value || '';
    var msgEl = document.getElementById('loginMsg');
    msgEl.className = 'msg';
    msgEl.textContent = '';
    if (!email || !password) { msgEl.className = 'msg error'; msgEl.textContent = 'Merci de renseigner e-mail et mot de passe.'; return; }
    var { data, error } = await FFP_DB.auth.signInWithPassword({ email: email, password: password });
    if (error) {
      msgEl.className = 'msg error';
      msgEl.textContent = 'Identifiants incorrects, ou aucun compte associé à cet e-mail.';
      return;
    }
    renderBookings(data.session);
  }

  async function doForgotPassword() {
    var email = (document.getElementById('liEmail').value || '').trim();
    var msgEl = document.getElementById('loginMsg');
    if (!email) { msgEl.className = 'msg error'; msgEl.textContent = 'Indiquez votre e-mail ci-dessus, puis cliquez à nouveau.'; return; }
    var { error } = await FFP_DB.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/academy/mes-reservations-client.html' });
    msgEl.className = error ? 'msg error' : 'msg ok';
    msgEl.textContent = error ? "Erreur lors de l'envoi. Réessayez." : 'E-mail de réinitialisation envoyé si un compte existe pour cette adresse.';
  }

  async function doLogout() {
    await FFP_DB.auth.signOut();
    location.reload();
  }

  async function renderBookings(session) {
    appRoot.innerHTML = '<div class="loading-state">Chargement de vos réservations…</div>';
    var { data: rows, error } = await FFP_DB
      .from('academy_bookings')
      .select(
        'id, participants_count, participant_names, amount_total_cents, payment_status, booking_status, created_at, ' +
        'academy_availabilities(start_time, end_time), ' +
        'academy_sessions(id, title, discipline, location_label, duration_minutes), ' +
        'academy_coaches(id, display_name, photo_url)'
      )
      .eq('booked_by', session.user.id)
      .order('created_at', { ascending: false });

    if (error) {
      appRoot.innerHTML = '<div class="error-banner">Impossible de charger vos réservations. Réessayez plus tard.</div>';
      return;
    }

    var { data: myReviews } = await FFP_DB.from('academy_reviews').select('booking_id, rating, comment').eq('reviewer_id', session.user.id);
    var reviewsByBooking = {};
    (myReviews || []).forEach(function (r) { reviewsByBooking[r.booking_id] = r; });

    var { data: receivedReviews } = await FFP_DB.from('academy_reviews').select('booking_id, rating, comment').eq('target_profile_id', session.user.id).eq('reviewer_type', 'coach');
    var receivedByBooking = {};
    (receivedReviews || []).forEach(function (r) { receivedByBooking[r.booking_id] = r; });

    var now = new Date();
    var upcoming = [], past = [];
    (rows || []).forEach(function (b) {
      var av = b.academy_availabilities;
      var start = av ? new Date(av.start_time) : null;
      if (start && start >= now && b.booking_status === 'confirmed') upcoming.push(b);
      else past.push(b);
    });
    upcoming.sort(function (a, b) { return new Date(a.academy_availabilities.start_time) - new Date(b.academy_availabilities.start_time); });
    past.sort(function (a, b) {
      var da = a.academy_availabilities ? a.academy_availabilities.start_time : a.created_at;
      var db = b.academy_availabilities ? b.academy_availabilities.start_time : b.created_at;
      return new Date(db) - new Date(da);
    });

    var html = '<div class="top-header"><h1>Mes réservations</h1>' +
      '<div style="display:flex; align-items:center; gap:14px;">' +
      '<div class="notif-wrap"><button class="notif-bell" id="notifBell" onclick="ClientBookings.toggleNotifDropdown()">🔔<span class="notif-badge" id="notifBadge" style="display:none;">0</span></button><div class="notif-dropdown" id="notifDropdown"></div></div>' +
      '<span class="user-chip">' + escapeHtml(session.user.email) + '</span>' +
      '<button class="logout" onclick="ClientBookings.doLogout()">Déconnexion</button></div></div>';

    if (!rows || !rows.length) {
      html += '<div class="empty-state">Vous n\'avez pas encore de réservation.<br><br><a href="/academy/#trouver" style="color:var(--gold); text-decoration:underline;">Trouver un coach →</a></div>';
      appRoot.innerHTML = html;
      loadNotifications();
      return;
    }

    html += '<div class="section-title">À venir (' + upcoming.length + ')</div>';
    html += upcoming.length ? upcoming.map(renderBookingRow).join('') : '<div class="empty-state">Aucune réservation à venir.</div>';

    html += '<div class="section-title">Historique (' + past.length + ')</div>';
    html += past.length ? past.map(function (b) { return renderBookingRow(b, reviewsByBooking[b.id], receivedByBooking[b.id]); }).join('') : '<div class="empty-state">Aucun historique pour le moment.</div>';

    appRoot.innerHTML = html;
    loadNotifications();
  }

  var CACHED_NOTIFS = [];

  function timeAgo(iso) {
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "à l'instant";
    if (mins < 60) return 'il y a ' + mins + ' min';
    var hours = Math.floor(mins / 60);
    if (hours < 24) return 'il y a ' + hours + ' h';
    return 'il y a ' + Math.floor(hours / 24) + ' j';
  }

  async function loadNotifications() {
    var { data: notifs } = await FFP_DB
      .from('academy_notifications')
      .select('id, type, message, is_read, created_at')
      .order('created_at', { ascending: false })
      .limit(15);
    CACHED_NOTIFS = notifs || [];
    var unreadCount = CACHED_NOTIFS.filter(function (n) { return !n.is_read; }).length;
    var badge = document.getElementById('notifBadge');
    if (badge) {
      badge.style.display = unreadCount > 0 ? 'flex' : 'none';
      badge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
    }
  }

  async function toggleNotifDropdown() {
    var dd = document.getElementById('notifDropdown');
    if (!dd) return;
    var willOpen = !dd.classList.contains('open');
    dd.classList.toggle('open', willOpen);
    if (!willOpen) return;

    dd.innerHTML = CACHED_NOTIFS.length
      ? CACHED_NOTIFS.map(function (n) {
          return '<div class="notif-item ' + (n.is_read ? '' : 'unread') + '">' + escapeHtml(n.message) + '<div class="notif-time">' + timeAgo(n.created_at) + '</div></div>';
        }).join('')
      : '<div class="notif-empty">Aucune notification pour le moment.</div>';

    var unreadIds = CACHED_NOTIFS.filter(function (n) { return !n.is_read; }).map(function (n) { return n.id; });
    if (unreadIds.length) {
      await FFP_DB.from('academy_notifications').update({ is_read: true }).in('id', unreadIds);
      var badge = document.getElementById('notifBadge');
      if (badge) badge.style.display = 'none';
      CACHED_NOTIFS = CACHED_NOTIFS.map(function (n) { return Object.assign({}, n, { is_read: true }); });
    }
  }

  document.addEventListener('click', function (e) {
    var wrap = document.querySelector('.notif-wrap');
    var dd = document.getElementById('notifDropdown');
    if (wrap && dd && dd.classList.contains('open') && !wrap.contains(e.target)) dd.classList.remove('open');
  });

  function renderBookingRow(b, existingReview, receivedReview) {
    var s = b.academy_sessions || {};
    var coach = b.academy_coaches || {};
    var av = b.academy_availabilities;
    var start = av ? new Date(av.start_time) : null;
    var day = start ? start.getDate() : '–';
    var month = start ? MONTHS[start.getMonth()] : '';
    var timeStr = start ? start.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';
    var statusInfo = STATUS_LABELS[b.booking_status] || ['—', 'status-completed'];
    var amount = ((b.amount_total_cents || 0) / 100).toFixed(2).replace('.', ',');
    var payLabel = b.payment_status === 'paid' ? 'Payé' : b.payment_status === 'refunded' ? 'Remboursé' : b.payment_status === 'failed' ? 'Échec paiement' : 'En attente';

    var canCancel = b.booking_status === 'confirmed' && start && start >= new Date();
    var hoursLeft = start ? (start.getTime() - Date.now()) / 3600000 : 0;
    var cancelBlock = '';
    if (canCancel) {
      var noticeTxt = hoursLeft >= 24
        ? 'Annulation gratuite possible.'
        : 'Hors délai de 24h : annulation possible mais sans remboursement.';
      cancelBlock =
        '<button class="btn-cancel" id="cancelBtn-' + b.id + '" onclick="ClientBookings.doCancel(\'' + b.id + '\')">Annuler</button>' +
        '<div class="cancel-msg" id="cancelNotice-' + b.id + '" style="color:#777;">' + noticeTxt + '</div>';
    }

    var receivedBlock = '';
    if (receivedReview) {
      receivedBlock = '<div class="review-display" style="opacity:0.85;"><div class="booking-meta" style="margin-bottom:2px;">Note reçue du coach :</div>' +
        '<span class="stars-shown">' + '★'.repeat(receivedReview.rating) + '☆'.repeat(5 - receivedReview.rating) + '</span>' +
        (receivedReview.comment ? '<div class="review-comment">' + escapeHtml(receivedReview.comment) + '</div>' : '') +
        '</div>';
    }

    var reviewBlock = '';
    if (b.booking_status === 'completed') {
      if (existingReview) {
        reviewBlock = '<div class="review-display">' +
          '<span class="stars-shown">' + '★'.repeat(existingReview.rating) + '☆'.repeat(5 - existingReview.rating) + '</span>' +
          (existingReview.comment ? '<div class="review-comment">' + escapeHtml(existingReview.comment) + '</div>' : '') +
          '</div>';
      } else {
        reviewBlock = '<button class="btn-review" id="reviewBtn-' + b.id + '" onclick="ClientBookings.openReviewForm(\'' + b.id + '\', \'' + (coach.id || '') + '\')">Laisser un avis</button>' +
          '<div id="reviewFormWrap-' + b.id + '"></div>';
      }
    }

    return '<div class="booking-row" id="bookingRow-' + b.id + '">' +
      '<div class="booking-left">' +
      '<div class="booking-date-box"><span class="day">' + day + '</span><span class="month">' + month + '</span></div>' +
      '<div>' +
      '<div class="booking-title">' + escapeHtml(s.title || 'Séance') + '</div>' +
      '<div class="booking-meta">' + escapeHtml(coach.display_name || '') + (s.discipline ? ' · ' + escapeHtml(s.discipline) : '') + (timeStr ? ' · ' + timeStr : '') + '</div>' +
      '<div class="booking-meta">' + escapeHtml(s.location_label || '') + ' · ' + (b.participants_count || 1) + ' participant(s)</div>' +
      cancelBlock +
      reviewBlock +
      receivedBlock +
      '</div>' +
      '</div>' +
      '<div class="booking-right">' +
      '<div class="booking-amount">' + amount + ' €<span class="sub">' + payLabel + '</span></div>' +
      '<span class="status-pill ' + statusInfo[1] + '">' + statusInfo[0] + '</span>' +
      '</div>' +
      '</div>';
  }

  var PENDING_RATINGS = {};

  function openReviewForm(bookingId, coachId) {
    var btn = document.getElementById('reviewBtn-' + bookingId);
    if (btn) btn.style.display = 'none';
    var wrap = document.getElementById('reviewFormWrap-' + bookingId);
    var stars = [1, 2, 3, 4, 5].map(function (i) {
      return '<span class="star-choice" id="star-' + bookingId + '-' + i + '" data-val="' + i + '" onclick="ClientBookings.setRating(\'' + bookingId + '\',' + i + ')">★</span>';
    }).join('');
    wrap.innerHTML = '<div class="review-form">' +
      '<div class="star-picker" id="starPicker-' + bookingId + '">' + stars + '</div>' +
      '<textarea id="reviewComment-' + bookingId + '" placeholder="Votre avis (optionnel)"></textarea>' +
      '<button class="btn-primary-sm" id="reviewSubmit-' + bookingId + '" onclick="ClientBookings.submitReview(\'' + bookingId + '\',\'' + coachId + '\')">Envoyer mon avis</button>' +
      '<div class="cancel-msg" id="reviewMsg-' + bookingId + '"></div>' +
      '</div>';
  }

  function setRating(bookingId, val) {
    PENDING_RATINGS[bookingId] = val;
    for (var i = 1; i <= 5; i++) {
      var el = document.getElementById('star-' + bookingId + '-' + i);
      if (el) el.classList.toggle('selected', i <= val);
    }
  }

  async function submitReview(bookingId, coachId) {
    var rating = PENDING_RATINGS[bookingId];
    var msgEl = document.getElementById('reviewMsg-' + bookingId);
    if (!rating) { if (msgEl) { msgEl.className = 'cancel-msg error'; msgEl.textContent = 'Choisissez une note avant d\'envoyer.'; } return; }
    var comment = (document.getElementById('reviewComment-' + bookingId).value || '').trim();
    var btn = document.getElementById('reviewSubmit-' + bookingId);
    if (btn) { btn.disabled = true; btn.textContent = 'Envoi…'; }

    var { data: sessData } = await FFP_DB.auth.getSession();
    var { error } = await FFP_DB.from('academy_reviews').insert({
      booking_id: bookingId,
      reviewer_id: sessData.session.user.id,
      reviewer_type: 'parent',
      target_coach_id: coachId || null,
      rating: rating,
      comment: comment || null
    });

    if (error) {
      if (msgEl) { msgEl.className = 'cancel-msg error'; msgEl.textContent = "Erreur lors de l'envoi. Réessayez."; }
      if (btn) { btn.disabled = false; btn.textContent = 'Envoyer mon avis'; }
      return;
    }
    var wrap = document.getElementById('reviewFormWrap-' + bookingId);
    if (wrap) wrap.innerHTML = '<div class="review-display"><span class="stars-shown">' + '★'.repeat(rating) + '☆'.repeat(5 - rating) + '</span>' + (comment ? '<div class="review-comment">' + escapeHtml(comment) + '</div>' : '') + '</div>';
  }

  var CURRENT_SESSION = null;

  async function doCancel(bookingId) {
    var ok = window.confirm('Confirmer l\'annulation de cette réservation ?');
    if (!ok) return;
    var btn = document.getElementById('cancelBtn-' + bookingId);
    var notice = document.getElementById('cancelNotice-' + bookingId);
    if (btn) { btn.disabled = true; btn.textContent = 'Annulation…'; }

    try {
      var { data: sessData } = await FFP_DB.auth.getSession();
      var token = sessData && sessData.session ? sessData.session.access_token : null;
      if (!token) { if (notice) { notice.className = 'cancel-msg error'; notice.textContent = 'Session expirée, reconnectez-vous.'; } return; }

      var res = await fetch('https://qpabgwskavglvojhuzeq.supabase.co/functions/v1/cancel-academy-booking', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ booking_id: bookingId })
      });
      var out = await res.json();
      if (!res.ok) {
        if (notice) { notice.className = 'cancel-msg error'; notice.textContent = out.error || 'Erreur lors de l\'annulation.'; }
        if (btn) { btn.disabled = false; btn.textContent = 'Annuler'; }
        return;
      }
      if (notice) { notice.className = 'cancel-msg ok'; notice.textContent = out.message; }
      if (btn) btn.style.display = 'none';
      setTimeout(function () { FFP_DB.auth.getSession().then(function (r) { renderBookings(r.data.session); }); }, 1200);
    } catch (e) {
      if (notice) { notice.className = 'cancel-msg error'; notice.textContent = 'Erreur réseau, réessayez.'; }
      if (btn) { btn.disabled = false; btn.textContent = 'Annuler'; }
    }
  }

  window.ClientBookings = { doLogin: doLogin, doForgotPassword: doForgotPassword, doLogout: doLogout, doCancel: doCancel, openReviewForm: openReviewForm, setRating: setRating, submitReview: submitReview, toggleNotifDropdown: toggleNotifDropdown };
  init();
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/ffp-sw.js").catch(function () {});</script>
</body>
