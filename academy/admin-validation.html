<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Console Super Admin — Academy One Sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --black:#0A0A0A; --surface:#111111; --surface2:#181818; --border:#2a2a2a;
    --text:#EEEEEE; --gold:#C9A84C; --red:#E05252; --green:#4ADE80; --blue:#5EA8E0; --gray:#8A8A8A;
  }
  body { background:var(--black); color:var(--text); font-family:'Barlow',sans-serif; }
  a { color:inherit; }
  h1,h2,h3 { font-family:'Barlow Condensed',sans-serif; font-weight:700; }

  nav { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--black); z-index:20; }
  .nav-logo img { height:36px; filter:invert(1); }

  .container { max-width:1180px; margin:0 auto; padding:28px 20px 90px; }
  .loading-state, .empty-state { text-align:center; padding:60px 20px; color:#777; }
  .denied { text-align:center; padding:100px 20px; color:#F5A3A3; }

  .page-header { margin-bottom:20px; }
  .page-header h1 { font-size:1.4rem; text-transform:uppercase; }
  .page-header .sub { color:#999; font-size:0.88rem; margin-top:4px; }

  /* ── Tabs ── */
  .tabbar { display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:22px; flex-wrap:wrap; }
  .tab-btn {
    background:none; border:none; color:#999; font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:0.92rem; text-transform:uppercase; letter-spacing:0.03em; padding:12px 16px; cursor:pointer;
    border-bottom:2px solid transparent; display:flex; align-items:center; gap:8px;
  }
  .tab-btn:hover { color:var(--text); }
  .tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); }
  .tab-btn .count-badge { background:#333; color:#ccc; }
  .tab-btn.active .count-badge { background:var(--gold); color:#0A0A0A; }
  .tab-btn .count-badge.warn { background:var(--gold); color:#0A0A0A; }

  /* ── Filter bar ── */
  .filter-bar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
  .filter-bar input[type=text] { flex:1; min-width:180px; }
  .filter-bar .spacer { flex:1; }
  .refresh-btn { background:var(--surface2); border:1px solid var(--border); color:#ccc; border-radius:3px; padding:8px 14px; font-size:0.82rem; cursor:pointer; font-family:'Barlow',sans-serif; }
  .refresh-btn:hover { border-color:var(--gold); color:var(--gold); }

  .section-title {
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:0.85rem;
    text-transform:uppercase; letter-spacing:0.06em; color:var(--gold); margin:34px 0 16px;
    display:flex; align-items:center; gap:10px;
  }
  .count-badge { background:var(--gold); color:#0A0A0A; border-radius:10px; padding:1px 9px; font-size:0.78rem; font-family:'Barlow',sans-serif; font-weight:600; }

  .review-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:22px; margin-bottom:16px; }
  .review-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .review-title { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.1rem; }
  .review-meta { font-size:0.84rem; color:#999; margin-top:4px; }
  .review-meta div { margin-top:2px; }
  .review-top-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

  .docs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin:14px 0; }
  .doc-chip {
    display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border);
    border-radius:5px; padding:10px 12px; text-decoration:none; color:#EEE; font-size:0.82rem;
  }
  .doc-chip:hover { border-color:var(--gold); }
  .doc-chip .icon { font-size:1rem; }
  .doc-missing { color:#666; font-style:italic; font-size:0.82rem; padding:10px 0; }

  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px) { .two-col { grid-template-columns:1fr; } }

  .field-row { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field-row label { font-size:0.72rem; color:#888; text-transform:uppercase; letter-spacing:0.05em; }
  .field-row .hint { font-size:0.76rem; color:#666; font-style:italic; }

  input[type=text], input[type=search], textarea, select {
    width:100%; padding:9px 11px; border:1.5px solid var(--border); border-radius:3px;
    background:var(--surface2); color:#FFF; font-family:'Barlow',sans-serif; font-size:0.88rem;
  }
  textarea { min-height:56px; resize:vertical; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--gold); }
  select { cursor:pointer; }

  .inline-status { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .inline-status select { width:auto; min-width:150px; }

  .actions { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .btn { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:0.82rem; letter-spacing:0.05em; text-transform:uppercase; padding:10px 18px; border-radius:3px; cursor:pointer; border:none; }
  .btn-save { background:var(--blue); color:#0A0A0A; }
  .btn-save:hover { background:#7EC0F0; }
  .btn-approve { background:var(--green); color:#0A0A0A; }
  .btn-approve:hover { background:#6EE89A; }
  .btn-reject { background:none; color:var(--red); border:1.5px solid rgba(224,82,82,0.4); }
  .btn-reject:hover { background:rgba(224,82,82,0.1); }
  .btn-ghost { background:none; color:#ccc; border:1.5px solid var(--border); }
  .btn-ghost:hover { border-color:#888; color:#fff; }
  .btn-danger { background:none; color:var(--red); border:1.5px solid rgba(224,82,82,0.4); }
  .btn-danger:hover { background:var(--red); color:#0A0A0A; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .status-pill { font-size:0.72rem; font-weight:600; padding:3px 10px; border-radius:10px; text-transform:uppercase; white-space:nowrap; }
  .status-pending { background:rgba(201,168,76,0.15); color:var(--gold); }
  .status-verified, .status-approved, .status-confirmed, .status-paid, .status-completed { background:rgba(74,222,128,0.13); color:var(--green); }
  .status-rejected, .status-failed, .status-cancelled_by_parent, .status-cancelled_by_coach { background:rgba(224,82,82,0.13); color:var(--red); }
  .status-suspended, .status-no_show, .status-refunded { background:rgba(94,168,224,0.13); color:var(--blue); }
  .status-inactive { background:rgba(138,138,138,0.15); color:var(--gray); }

  .toggle-btn { font-size:0.76rem; padding:5px 11px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:#ccc; cursor:pointer; }
  .toggle-btn.on { color:var(--green); border-color:rgba(74,222,128,0.35); }
  .toggle-btn.off { color:var(--gray); }

  .status-msg { margin-top:10px; font-size:0.84rem; }
  .status-msg.ok { color:var(--green); }
  .status-msg.err { color:#F5A3A3; }

  .mono { font-family:monospace; font-size:0.78rem; color:#999; word-break:break-all; }
  .thumb { width:44px; height:44px; border-radius:6px; object-fit:cover; background:#222; border:1px solid var(--border); }
</style>
</head>
<body>

<nav>
  <a href="/academy/" class="nav-logo"><img src="/logo-one-sport-officiel.png" alt="One Sport" /></a>
</nav>

<div class="container">
  <div id="loadingState" class="loading-state">Chargement…</div>
  <div id="appRoot" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/ffp-supabase.js"></script>
<script>
(function() {
  var loadingEl = document.getElementById('loadingState');
  var appRoot = document.getElementById('appRoot');
  var LOGIN_PAGE_URL = '/ffp-login.html';
  var myProfileId = null;

  var TABS = ['academies', 'coaches', 'bookings', 'availabilities'];
  var TAB_LABELS = { academies:'🏫 Académies', coaches:'🧑‍🏫 Coachs', bookings:'📅 Réservations', availabilities:'🕐 Disponibilités' };
  var currentTab = 'academies';

  var CACHE = { academies:null, coaches:null, bookings:null, availabilities:null };
  var FILTER = {
    academies: { status:'all', q:'' },
    coaches: { status:'all', q:'' },
    bookings: { status:'all', q:'' },
    availabilities: { status:'all', q:'' }
  };

  init();

  async function init() {
    if (typeof initSupabase === 'function') initSupabase();
    if (!FFP_DB) { renderDenied("Impossible de contacter le serveur."); return; }

    var { data } = await FFP_DB.auth.getSession();
    if (!data.session) { window.location.href = LOGIN_PAGE_URL; return; }
    myProfileId = data.session.user.id;

    var { data: profile } = await FFP_DB.from('profiles').select('role').eq('id', myProfileId).maybeSingle();
    if (!profile || profile.role !== 'superadmin') {
      renderDenied("Accès réservé aux administrateurs One Sport.");
      return;
    }

    await renderShell();
  }

  function renderDenied(msg) {
    loadingEl.style.display = 'none';
    appRoot.style.display = 'block';
    appRoot.innerHTML = '<div class="denied">⛔ ' + escapeHtml(msg) + '</div>';
  }

  // ═══════════════════ SHELL / TABS ═══════════════════
  async function renderShell() {
    loadingEl.style.display = 'none';
    appRoot.style.display = 'block';

    appRoot.innerHTML =
      '<div class="page-header">' +
        '<h1>Console Super Admin — Academy</h1>' +
        '<div class="sub">Gérez manuellement toutes les inscriptions, validations, modifications et suppressions des académies, coachs, réservations et disponibilités.</div>' +
      '</div>' +
      '<div class="tabbar" id="tabbar"></div>' +
      '<div id="tabBody"></div>';

    renderTabBar();
    await switchTab('academies', true);
  }

  function renderTabBar() {
    var bar = document.getElementById('tabbar');
    bar.innerHTML = TABS.map(function(t) {
      return '<button class="tab-btn' + (t === currentTab ? ' active' : '') + '" data-tab="' + t + '">' +
        TAB_LABELS[t] + '<span class="count-badge" id="tabcount-' + t + '"></span></button>';
    }).join('');
    bar.querySelectorAll('[data-tab]').forEach(function(btn) {
      btn.addEventListener('click', function() { switchTab(btn.dataset.tab, false); });
    });
  }

  async function switchTab(tab, force) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tab === tab); });
    var body = document.getElementById('tabBody');
    body.innerHTML = '<div class="loading-state">Chargement…</div>';

    if (force || !CACHE[tab]) await loadTabData(tab);
    renderTabBody(tab);
    updateTabCounts();
  }

  async function loadTabData(tab) {
    if (tab === 'academies') CACHE.academies = await fetchAcademies();
    else if (tab === 'coaches') CACHE.coaches = await fetchCoaches();
    else if (tab === 'bookings') CACHE.bookings = await fetchBookings();
    else if (tab === 'availabilities') CACHE.availabilities = await fetchAvailabilities();
  }

  function updateTabCounts() {
    var a = CACHE.academies || [], c = CACHE.coaches || [];
    var pendingA = a.filter(function(x) { return x.verification_status === 'pending'; }).length;
    var pendingC = c.filter(function(x) { return x.documents_status === 'pending'; }).length;
    setCount('academies', a.length, pendingA);
    setCount('coaches', c.length, pendingC);
    setCount('bookings', (CACHE.bookings || []).length, 0);
    setCount('availabilities', (CACHE.availabilities || []).length, 0);
  }
  function setCount(tab, total, pending) {
    var el = document.getElementById('tabcount-' + tab);
    if (!el) return;
    el.textContent = pending > 0 ? (pending + ' ⏳') : String(total);
    el.classList.toggle('warn', pending > 0);
  }

  function renderTabBody(tab) {
    var body = document.getElementById('tabBody');
    var statusOptions = {
      academies: [['all','Tous les statuts'],['pending','En attente'],['verified','Vérifiées'],['rejected','Rejetées'],['suspended','Suspendues']],
      coaches: [['all','Tous les statuts'],['pending','En attente'],['approved','Approuvés'],['rejected','Rejetés']],
      bookings: [['all','Tous les statuts'],['confirmed','Confirmées'],['completed','Terminées'],['cancelled_by_parent','Annulées (parent)'],['cancelled_by_coach','Annulées (coach)'],['no_show','Absence']],
      availabilities: [['all','Tous'],['free','Libres'],['booked','Réservées']]
    };
    var placeholder = {
      academies: 'Rechercher une académie, un propriétaire, un email…',
      coaches: 'Rechercher un coach, une académie…',
      bookings: 'Rechercher un coach, une académie, un parent…',
      availabilities: 'Rechercher un coach, une académie…'
    };

    body.innerHTML =
      '<div class="filter-bar">' +
        '<select id="filter-status">' + statusOptions[tab].map(function(o) {
          return '<option value="' + o[0] + '"' + (o[0] === FILTER[tab].status ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') + '</select>' +
        '<input type="text" id="filter-q" placeholder="' + placeholder[tab] + '" value="' + escapeHtml(FILTER[tab].q) + '">' +
        '<div class="spacer"></div>' +
        '<button class="refresh-btn" id="btn-refresh">🔄 Actualiser</button>' +
      '</div>' +
      '<div id="listArea"></div>';

    document.getElementById('filter-status').addEventListener('change', function(e) {
      FILTER[tab].status = e.target.value; renderList(tab);
    });
    document.getElementById('filter-q').addEventListener('input', function(e) {
      FILTER[tab].q = e.target.value; renderList(tab);
    });
    document.getElementById('btn-refresh').addEventListener('click', function() { switchTab(tab, true); });

    renderList(tab);
  }

  function renderList(tab) {
    if (tab === 'academies') renderAcademies(applyFilter(CACHE.academies, 'academies'));
    else if (tab === 'coaches') renderCoaches(applyFilter(CACHE.coaches, 'coaches'));
    else if (tab === 'bookings') renderBookings(applyFilter(CACHE.bookings, 'bookings'));
    else if (tab === 'availabilities') renderAvailabilities(applyFilter(CACHE.availabilities, 'availabilities'));
  }

  function applyFilter(rows, tab) {
    rows = rows || [];
    var f = FILTER[tab];
    var q = (f.q || '').trim().toLowerCase();

    var filtered = rows.filter(function(r) {
      if (f.status !== 'all') {
        if (tab === 'academies' && r.verification_status !== f.status) return false;
        if (tab === 'coaches' && r.documents_status !== f.status) return false;
        if (tab === 'bookings' && r.booking_status !== f.status) return false;
        if (tab === 'availabilities') {
          if (f.status === 'free' && r.is_booked) return false;
          if (f.status === 'booked' && !r.is_booked) return false;
        }
      }
      if (!q) return true;
      return searchHaystack(r, tab).indexOf(q) >= 0;
    });
    return filtered;
  }

  function searchHaystack(r, tab) {
    var owner = r.profiles || {};
    if (tab === 'academies') {
      return [r.academy_name, owner.prenom, owner.nom, owner.email].join(' ').toLowerCase();
    }
    if (tab === 'coaches') {
      var acName = r.academy_academies ? r.academy_academies.academy_name : '';
      return [r.display_name, acName].join(' ').toLowerCase();
    }
    if (tab === 'bookings') {
      var coach = r.academy_coaches || {};
      var ac = coach.academy_academies ? coach.academy_academies.academy_name : '';
      var booker = r.profiles || {};
      var sess = r.academy_sessions || {};
      return [coach.display_name, ac, booker.prenom, booker.nom, booker.email, sess.title, sess.discipline].join(' ').toLowerCase();
    }
    if (tab === 'availabilities') {
      var sess2 = r.academy_sessions || {};
      var coach2 = sess2.academy_coaches || {};
      var ac2 = coach2.academy_academies ? coach2.academy_academies.academy_name : '';
      return [sess2.title, coach2.display_name, ac2].join(' ').toLowerCase();
    }
    return '';
  }

  // ═══════════════════ FETCH ═══════════════════
  var LIMIT = 500;

  async function fetchAcademies() {
    var { data: academies, error } = await FFP_DB
      .from('academy_academies')
      .select('id, academy_name, description, logo_url, owner_profile_id, stripe_account_id, stripe_onboarding_complete, verification_status, verification_notes, verified_at, is_active, created_at, profiles:owner_profile_id(prenom, nom, email)')
      .order('created_at', { ascending: false })
      .limit(LIMIT);
    if (error) { toastGlobal('Erreur chargement académies : ' + error.message, true); return []; }
    academies = academies || [];

    var ids = academies.map(function(a) { return a.id; });
    var docsByAcademy = {};
    if (ids.length) {
      var { data: docs } = await FFP_DB.from('academy_documents')
        .select('id, academy_id, document_type, file_path, file_name')
        .in('academy_id', ids).is('coach_id', null);
      var urlMap = await bulkSignedUrls((docs || []).map(function(d) { return d.file_path; }));
      (docs || []).forEach(function(d) {
        d._url = urlMap[d.file_path] || '#';
        (docsByAcademy[d.academy_id] = docsByAcademy[d.academy_id] || []).push(d);
      });
    }
    academies.forEach(function(a) { a._docs = docsByAcademy[a.id] || []; });
    return academies;
  }

  async function fetchCoaches() {
    var { data: coaches, error } = await FFP_DB
      .from('academy_coaches')
      .select('id, academy_id, display_name, bio, sport_cv, photo_url, disciplines, is_active, average_rating, total_reviews, documents_status, validation_notes, created_at, academy_academies(id, academy_name)')
      .order('created_at', { ascending: false })
      .limit(LIMIT);
    if (error) { toastGlobal('Erreur chargement coachs : ' + error.message, true); return []; }
    coaches = coaches || [];

    var ids = coaches.map(function(c) { return c.id; });
    var docsByCoach = {};
    if (ids.length) {
      var { data: docs } = await FFP_DB.from('academy_documents')
        .select('id, coach_id, document_type, file_path, file_name')
        .in('coach_id', ids);
      var urlMap = await bulkSignedUrls((docs || []).map(function(d) { return d.file_path; }));
      (docs || []).forEach(function(d) {
        d._url = urlMap[d.file_path] || '#';
        (docsByCoach[d.coach_id] = docsByCoach[d.coach_id] || []).push(d);
      });
    }
    coaches.forEach(function(c) { c._docs = docsByCoach[c.id] || []; });
    return coaches;
  }

  async function fetchBookings() {
    var { data, error } = await FFP_DB
      .from('academy_bookings')
      .select('id, participants_count, participant_names, amount_total_cents, platform_fee_cents, coach_payout_cents, payment_status, booking_status, cancellation_reason, stripe_payment_intent_id, created_at, academy_sessions(title, discipline), academy_availabilities(start_time, end_time), academy_coaches(id, display_name, academy_academies(academy_name)), profiles:booked_by(prenom, nom, email)')
      .order('created_at', { ascending: false })
      .limit(LIMIT);
    if (error) { toastGlobal('Erreur chargement réservations : ' + error.message, true); return []; }
    return data || [];
  }

  async function fetchAvailabilities() {
    var { data, error } = await FFP_DB
      .from('academy_availabilities')
      .select('id, start_time, end_time, is_booked, created_at, academy_sessions(id, title, coach_id, academy_coaches(display_name, academy_academies(academy_name)))')
      .order('start_time', { ascending: false })
      .limit(LIMIT);
    if (error) { toastGlobal('Erreur chargement disponibilités : ' + error.message, true); return []; }
    return data || [];
  }

  async function bulkSignedUrls(paths) {
    paths = paths.filter(Boolean);
    var map = {};
    if (!paths.length) return map;
    try {
      var { data, error } = await FFP_DB.storage.from('academy-documents').createSignedUrls(paths, 600);
      if (!error && data) {
        data.forEach(function(r) { if (r.path && r.signedUrl) map[r.path] = r.signedUrl; });
      }
    } catch (e) {}
    return map;
  }

  // ═══════════════════ ACADEMIES ═══════════════════
  function renderAcademies(list) {
    var listEl = document.getElementById('listArea');
    if (!list.length) { listEl.innerHTML = '<div class="empty-state">Aucune académie ne correspond aux filtres.</div>'; return; }

    listEl.innerHTML = list.map(function(a) {
      var owner = a.profiles || {};
      var docsHtml = docsGridHtml(a._docs, { assurance: '🛡️ Assurance RC Pro', kbis: '📄 Statut juridique (KBIS)' });
      return (
        '<div class="review-card" data-id="' + a.id + '">' +
          '<div class="review-top">' +
            '<div>' +
              '<div class="review-title">' + escapeHtml(a.academy_name) + '</div>' +
              '<div class="review-meta">' +
                '<div>Propriétaire : ' + escapeHtml(((owner.prenom || '') + ' ' + (owner.nom || '')).trim()) + ' — ' + escapeHtml(owner.email || '') + '</div>' +
                '<div>Créée le ' + fmtDate(a.created_at) + (a.verified_at ? ' · Statut modifié le ' + fmtDate(a.verified_at) : '') + '</div>' +
                '<div class="mono">Stripe : ' + (a.stripe_onboarding_complete ? '✅ configuré' : '⚠️ non configuré') + (a.stripe_account_id ? ' (' + escapeHtml(a.stripe_account_id) + ')' : '') + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="review-top-right">' +
              statusPill(a.verification_status) +
              '<button class="toggle-btn ' + (a.is_active ? 'on' : 'off') + '" data-toggle-active="' + a.id + '">' + (a.is_active ? '🟢 Active' : '⚪ Inactive') + '</button>' +
            '</div>' +
          '</div>' +

          '<div class="two-col">' +
            '<div class="field-row"><label>Nom de l\'académie</label><input type="text" id="name-academy-' + a.id + '" value="' + escapeHtml(a.academy_name) + '"></div>' +

  async function saveAcademy(id) {
    var msgEl = document.getElementById('msg-academy-' + id);
    var payload = {
      academy_name: document.getElementById('name-academy-' + id).value.trim(),
      logo_url: document.getElementById('logo-academy-' + id).value.trim() || null,
      description: document.getElementById('desc-academy-' + id).value.trim() || null,
      verification_notes: document.getElementById('notes-academy-' + id).value.trim() || null
    };
    if (!payload.academy_name) { showMsg(msgEl, "Le nom de l'académie est obligatoire.", true); return; }

    var { error } = await FFP_DB.from('academy_academies').update(payload).eq('id', id);
    if (error) { showMsg(msgEl, 'Erreur : ' + error.message, true); return; }
    Object.assign(findById(CACHE.academies, id), payload);
    var titleEl = msgEl.closest('.review-card').querySelector('.review-title');
    if (titleEl) titleEl.textContent = payload.academy_name;
    showMsg(msgEl, '✓ Modifications enregistrées.', false);
  }

  async function applyAcademyStatus(id) {
    var msgEl = document.getElementById('msg-academy-' + id);
    var newStatus = document.getElementById('status-academy-' + id).value;
    var notes = document.getElementById('notes-academy-' + id).value.trim();
    var { error } = await FFP_DB.from('academy_academies').update({
      verification_status: newStatus,
      verification_notes: notes || null,
      verified_at: new Date().toISOString(),
      verified_by: myProfileId
    }).eq('id', id);
    if (error) { showMsg(msgEl, 'Erreur : ' + error.message, true); return; }
    var row = findById(CACHE.academies, id);
    row.verification_status = newStatus; row.verification_notes = notes || null; row.verified_at = new Date().toISOString();

  async function toggleAcademyActive(id) {

    if (error) { showMsg(msgEl, 'Erreur : ' + error.message, true); return; }

          '<div class="review-top">' +

              '</select>' +
              '<div class="hint">Ceci met seulement à jour le statut en base — cela ne déclenche aucun remboursement Stripe réel.</div>' +
            '</div>' +

          '<div class="field-row"><label>Motif d\'annulation (optionnel)</label><textarea id="reason-' + b.id + '">' + escapeHtml(b.cancellation_reason || '') + '</textarea></div>' +

    if (error) { showMsg(msgEl, 'Suppression impossible : ' + friendlyDeleteError(error), true); return; }

  // ═══════════════════ HELPERS ═══════════════════
  function docsGridHtml(docs, typeLabels) {
    var byType = {};
    (docs || []).forEach(function(d) { byType[d.document_type] = d; });
    return Object.keys(typeLabels).map(function(type) {
      var d = byType[type];
      if (!d) return '<div class="doc-missing">' + typeLabels[type] + ' — non fourni</div>';
      return '<a class="doc-chip" href="' + d._url + '" target="_blank" rel="noopener"><span class="icon">📎</span> ' + typeLabels[type] + '</a>';
    }).join('');
  }

  var STATUS_LABELS = {
    pending:'En attente', verified:'Vérifiée', rejected:'Rejetée', suspended:'Suspendue',
    approved:'Approuvé', confirmed:'Confirmée', completed:'Terminée',
    cancelled_by_parent:'Annulée (parent)', cancelled_by_coach:'Annulée (coach)', no_show:'Absence',
    paid:'Payée', refunded:'Remboursée', failed:'Échouée'
  };
  function statusLabel(s) { return STATUS_LABELS[s] || s; }
  function statusPill(s) { return '<span class="status-pill status-' + s + '">' + statusLabel(s) + '</span>'; }

  function findById(arr, id) { return (arr || []).find(function(x) { return x.id === id; }); }

  function showMsg(el, text, isErr) {
    if (!el) return;
    el.className = 'status-msg ' + (isErr ? 'err' : 'ok');
    el.textContent = text;
  }
  function toastGlobal(text, isErr) {
    console[isErr ? 'error' : 'log'](text);
  }

  function friendlyDeleteError(error) {
    if (error && error.code === '23503') {
      return 'des éléments liés existent encore (réservations, avis…).';
    }
    return error ? error.message : 'erreur inconnue.';
  }

  function fmtDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString('fr-FR'); }
  function fmtDateTime(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString('fr-FR') + ' ' + new Date(iso).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }); }
  function fmtMoney(cents) { return ((cents || 0) / 100).toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €'; }

  function escapeHtml(str) { var d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }
})();
</script>
